<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DayZ Admin Tools portal</title>
<style>
:root { --bg: #0f1115; --panel: #171a21; --panel2: #1f232c; --border: #2a2f3a; --text: #e6e8ee; --muted: #8a94a6; --accent: #4f8cff; --ok: #3ddc84; --warn: #f5b942; --bad: #ff5f5f; }
* { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, Segoe UI, sans-serif; }
a { color: var(--accent); } button, input, select, textarea { font: inherit; color: inherit; }
.btn { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 11px; cursor: pointer; } .btn:hover { border-color: var(--accent); } .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .btn.danger { color: var(--bad); } .btn.small { padding: 3px 8px; font-size: 12.5px; } .btn:disabled { opacity: .5; cursor: default; }
.input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; width: 100%; } textarea.input { min-height: 70px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .grow { flex: 1; } .mt { margin-top: 10px; }
.badge { font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid var(--border); color: var(--muted); } .badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); } .badge.bad { color: var(--bad); }
header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header b { font-size: 16px; } nav { display: flex; gap: 4px; flex-wrap: wrap; } nav button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px; cursor: pointer; color: var(--muted); } nav button.on { color: var(--text); background: var(--panel2); border-color: var(--border); }
main { padding: 14px 16px; max-width: 1400px; margin: 0 auto; } .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; } .card h3 { margin: 0 0 8px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; } .big { font-size: 26px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 13px; } th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); } td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; } tr.sel td { background: #1d2a44; } tbody tr:hover td { background: var(--panel2); cursor: pointer; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; } @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.login { max-width: 360px; margin: 10vh auto; }
pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 12px; max-height: 70vh; overflow: auto; white-space: pre-wrap; word-break: break-all; }
#mapWrap { position: relative; } #map { width: 100%; height: 70vh; background: #11151b; border: 1px solid var(--border); border-radius: 8px; display: block; cursor: grab; }
.menu { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,.5); } .menu div { padding: 6px 10px; border-radius: 4px; cursor: pointer; } .menu div:hover { background: var(--panel2); } .menu .h { font-weight: 600; cursor: default; border-bottom: 1px solid var(--border); margin-bottom: 3px; } .menu .d { color: var(--bad); }
.modalbg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 30; } .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; width: 480px; max-width: 94vw; max-height: 90vh; overflow: auto; } .modal h3 { margin: 0 0 8px; } .modal label { display: block; margin: 8px 0 4px; color: var(--muted); font-size: 12.5px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; z-index: 40; } .toast.bad { border-color: var(--bad); }
.perm { display: grid; grid-template-columns: 1fr; gap: 2px; } .perm label { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; } .perm .g { color: var(--muted); font-size: 12px; margin-top: 6px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--panel2); border: 1px solid var(--border); font-size: 12px; margin: 1px; }
a[data-prof] { color: var(--text); text-decoration: none; border-bottom: 1px dotted var(--muted); } a[data-prof]:hover { color: var(--accent); }
#hdSearch { width: 200px; padding: 5px 9px; } #hdHits { position: fixed; min-width: 280px; }
.drawerbg { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.35); } .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; max-width: 96vw; background: var(--panel); border-left: 1px solid var(--border); z-index: 26; overflow: auto; padding: 14px 16px; box-shadow: -8px 0 24px rgba(0,0,0,.4); }
.drawer h2 { margin: 0 0 4px; font-size: 18px; } .drawer .sec { margin-top: 12px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; } .drawer .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; font-size: 13px; } .drawer .close { position: absolute; top: 10px; right: 12px; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; } .tabs button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--muted); } .tabs button.on { color: var(--text); background: var(--panel2); border-color: var(--border); }
</style>
</head>
<body>
<header><b>DayZ Admin Tools</b><span class="muted" id="hdInst"></span><nav id="nav"></nav><input id="hdSearch" class="input" placeholder="Find a player…" autocomplete="off" hidden><div id="hdHits" class="menu" hidden></div><span class="grow"></span><span class="muted small" id="hdUser"></span><button class="btn small" id="btnPw" hidden>Password</button><button class="btn small" id="btnOut" hidden>Sign out</button></header>
<main id="main"></main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (ts) => ts ? new Date(typeof ts === 'string' ? Date.parse(ts) : ts).toLocaleString() : '—';
const ago = (ts) => { if (!ts) return '—'; const m = Math.round((Date.now() - (typeof ts === 'string' ? Date.parse(ts) : ts)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; };
let me = null, page = 'dashboard', toastT = null;
function toast(msg, bad) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); document.body.appendChild(t); } t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), bad ? 6000 : 3000); }
async function api(route, body, params) {
  const qs = params ? '?' + new URLSearchParams(params) : '';
  const r = await fetch('/portal/api/' + route + qs, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json', 'X-Portal': '1' } : { 'X-Portal': '1' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ ok: false, error: 'bad reply' }));
  if (r.status === 401) { me = null; render(); throw new Error(j.error || 'Sign in.'); }
  if (!j.ok) throw new Error(j.error || 'failed');
  return j.data;
}
const can = (p) => !!(me && me.perms.includes(p));
// ---------- modal ----------
function modal(title, bodyHtml, buttons = [['OK', true, true], ['Cancel', false]]) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'modalbg';
    bg.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>${bodyHtml}<div class="row mt" style="justify-content:flex-end">${buttons.map((b, i) => `<button class="btn ${b[2] ? 'primary' : ''}" data-i="${i}">${esc(b[0])}</button>`).join('')}</div></div>`;
    bg.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { const v = buttons[Number(b.dataset.i)][1]; close(v); } else if (e.target === bg) close(false); });
    // callers read their inputs right after the promise settles, so hide now and take the DOM away a tick later
    const close = (v) => { bg.style.display = 'none'; resolve(v); setTimeout(() => bg.remove(), 0); };
    document.body.appendChild(bg); const f = bg.querySelector('input, textarea, select'); if (f) f.focus();
    bg.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { const b = bg.querySelector('button.primary'); if (b) b.click(); } });
  });
}
async function askReason(title, extraHtml = '', required = true) {
  const ok = await modal(title, extraHtml + `<label>Reason${required ? '' : ' (optional)'}</label><input id="mWhy" class="input" placeholder="Why (goes to the admin action channel)">`);
  if (!ok) return null; const v = $('mWhy').value.trim(); if (required && !v) { toast('Give a reason.', true); return null; } return v;
}
// ---------- pages ----------
const PAGES = [['dashboard', 'Dashboard', 'server.view'], ['players', 'Players', 'players.view'], ['map', 'Map', 'players.view'], ['lists', 'Lists', 'lists.view'], ['deaths', 'Deaths', 'deaths.view'], ['tickets', 'Tickets', 'tickets.view'], ['logs', 'Logs', 'logs.view'], ['audit', 'Audit', 'audit.view'], ['requests', 'Requests', '*'], ['users', 'Users', 'portal.users']];
let timer = null;
function render() {
  clearInterval(timer); timer = null; closeMenu();
  const main = $('main');
  if (!me) {
    $('nav').innerHTML = ''; $('hdUser').textContent = ''; $('btnOut').hidden = true; $('btnPw').hidden = true; $('hdInst').textContent = '';
    main.innerHTML = `<div class="card login"><h3>Sign in</h3><label class="muted small">User name</label><input id="lgName" class="input" autocomplete="username"><label class="muted small mt">Password</label><input id="lgPass" class="input" type="password" autocomplete="current-password"><div class="row mt"><button class="btn primary" id="lgGo">Sign in</button><span class="muted small" id="lgErr"></span></div></div>`;
    const go = async () => { try { await api('login', { name: $('lgName').value, password: $('lgPass').value }); await loadMe(); } catch (e) { $('lgErr').textContent = e.message; } };
    $('lgGo').onclick = go; $('lgPass').onkeydown = e => { if (e.key === 'Enter') go(); }; $('lgName').focus(); return;
  }
  const pages = PAGES.filter(p => p[2] === '*' || can(p[2])); if (!pages.some(p => p[0] === page)) page = pages.length ? pages[0][0] : 'none';
  $('nav').innerHTML = pages.map(p => `<button class="${p[0] === page ? 'on' : ''}" data-p="${p[0]}">${p[1]}</button>`).join('');
  $('nav').onclick = e => { const b = e.target.closest('button'); if (b) { page = b.dataset.p; render(); } };
  if (can('requests.approve')) api('requests').then(r => { const n = r.requests.filter(x => x.status === 'pending').length; const b = $('nav').querySelector('[data-p="requests"]'); if (b && n) b.innerHTML = 'Requests <span class="badge warn">' + n + '</span>'; }).catch(() => {});
  $('hdUser').textContent = `${me.name} · ${me.groups.join(', ') || 'no group'}`; $('btnOut').hidden = false; $('btnPw').hidden = false; $('hdInst').textContent = me.instance; $('hdSearch').hidden = !can('players.view');
  const fn = { dashboard: pageDashboard, players: pagePlayers, map: pageMap, lists: pageLists, deaths: pageDeaths, tickets: pageTickets, logs: pageLogs, audit: pageAudit, users: pageUsers, requests: pageRequests }[page];
  if (!fn) { main.innerHTML = '<div class="card">Your account has no permissions yet. Ask whoever manages the portal.</div>'; return; }
  fn(main).catch(e => { main.innerHTML = `<div class="card">${esc(e.message)}</div>`; });
}
async function loadMe() { try { me = await api('me'); } catch { me = null; } render(); }
$('btnOut').onclick = async () => { await api('logout', {}).catch(() => {}); me = null; render(); };
$('btnPw').onclick = async () => { const ok = await modal('Change your password', '<label>Current password</label><input id="pwA" class="input" type="password"><label>New password (8+ characters)</label><input id="pwB" class="input" type="password">'); if (!ok) return; try { await api('password', { current: $('pwA').value, password: $('pwB').value }); toast('Password changed'); } catch (e) { toast(e.message, true); } };
const stageText = (s) => !s.running ? 'Offline' : s.stage && !s.stage.ready ? 'Loading: ' + s.stage.label : s.stopping ? 'Stopping…' : 'Online';
// ---------- dashboard ----------
async function pageDashboard(main) {
  const draw = async () => {
    const d = await api('status'); const h = d.health || {};
    main.innerHTML = `<div class="grid">
      <div class="card"><h3>Server</h3><div class="big">${esc(stageText(d.server))}</div><div class="muted">${d.server.startedAt ? 'up since ' + fmt(d.server.startedAt) : ''}${d.server.crashLoop ? ' · crash loop: auto-restart paused' : ''}${d.server.restartPending ? ' · restarting' : ''}</div>
        ${can('server.control') ? `<div class="row mt">${d.server.running ? `<button class="btn" data-srv="restart">Restart</button><button class="btn danger" data-srv="stop">${d.server.stopping ? 'Force stop' : 'Stop'}</button>` : '<button class="btn primary" data-srv="start">Start</button>'}${can('server.backup') ? '<button class="btn" id="btnBackup">Backup now</button>' : ''}</div>` : ''}</div>
      <div class="card"><h3>Players</h3><div class="big">${d.online === null ? '—' : d.online}</div><div class="muted">online now · RCon ${d.rcon ? 'connected' : 'off'}</div></div>
      <div class="card"><h3>Health</h3><div>CPU ${h.cpu != null ? Math.round(h.cpu) + '%' : '—'} · RAM ${h.ramMB ? (h.ramMB / 1024).toFixed(1) + ' GB' : '—'} · FPS ${h.fps ? Math.round(h.fps) : '—'}</div><div class="muted">${d.map ? d.map.label + ' · ' + d.map.size + ' m' : ''} · ${esc(d.instance)}</div></div></div>`;
    main.querySelectorAll('[data-srv]').forEach(b => b.onclick = async () => { const what = b.dataset.srv; if (what !== 'start' && !(await modal(`${what === 'stop' ? 'Stop' : 'Restart'} the server?`, '<p class="muted">Players are disconnected; the world is saved first.</p>'))) return; try { await api('server', { what, force: d.server.stopping }); toast('Done'); draw(); } catch (e) { toast(e.message, true); } });
    const bk = $('btnBackup'); if (bk) bk.onclick = async () => { bk.disabled = true; try { const r = await api('backup', {}); toast(`Backup ${r.name} saved`); } catch (e) { toast(e.message, true); } bk.disabled = false; };
  };
  await draw(); timer = setInterval(() => draw().catch(() => {}), 5000);
}
// ---------- players ----------
let live = null;
const HEALS = [['all', 'Heal everything'], ['health', 'Health, blood and shock'], ['bleeding', 'Stop bleeding'], ['bones', 'Fix broken bones'], ['cure', 'Cure diseases'], ['food', 'Food and water']];
async function act(action, p, args = {}) {
  try { const r = await api('act', { action, id: p.id, args }); if (r && r.status === 'approval') return toast(`Sent for approval as request #${r.request} — see the Requests page.`); if (r && r.status === 'pending') return toast('The game picked it up but has not answered yet.'); toast(`${p.name}: ${action} done${r && r.ok !== undefined && (r.ok || r.fail) ? ` (${r.ok} ok${r.fail ? ', ' + r.fail + ' failed' : ''})` : ''}${r && r.body === 'body' ? ' · body removed' : ''}`); }
  catch (e) { toast(e.message, true); }
}
function closeMenu() { for (const m of document.querySelectorAll('.menu')) if (m.id !== 'hdHits') m.remove(); }
function showMenu(items, x, y) {
  closeMenu(); const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = items.map((it, i) => it.h ? `<div class="h">${esc(it.h)}</div>` : `<div data-i="${i}" class="${it.danger ? 'd' : ''}">${esc(it.label)}</div>`).join('');
  m.onclick = e => { const d = e.target.closest('[data-i]'); if (!d) return; closeMenu(); items[Number(d.dataset.i)].run(); };
  document.body.appendChild(m); const r = m.getBoundingClientRect(); m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px'; m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
}
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenu(); });
function playerMenu(p) {
  const others = (live && live.players || []).filter(o => o.id !== p.id); const items = [{ h: p.name + (p.god ? ' (god mode)' : '') + (!p.alive ? ' (dead)' : '') }];
  if (can('players.view')) items.push({ label: 'Profile', run: () => openPlayer(p.id, p.name) });
  const withWhy = (title, run, required = true, extra = '') => async () => { const why = await askReason(title, extra, required); if (why !== null) run(why); };
  if (can('admin.heal')) for (const [k, l] of HEALS) items.push({ label: l, run: withWhy(`${l} · ${p.name}`, why => act('heal', p, { what: k, reason: why })) });
  if (can('admin.teleport')) {
    for (const o of others) items.push({ label: `Teleport to ${o.name}`, run: withWhy(`Teleport ${p.name} to ${o.name}`, why => act('tpto', p, { to: o.id, reason: why })) });
    for (const o of others) items.push({ label: `Bring ${o.name} here`, run: withWhy(`Bring ${o.name} to ${p.name}`, why => act('bring', p, { to: o.id, reason: why })) });
    items.push({ label: 'Teleport to their last death', run: withWhy(`Teleport ${p.name} to their last death`, why => act('tpdeath', p, { reason: why })) });
    items.push({ label: 'Teleport to a map point…', run: async () => { const ok = await modal(`Teleport ${p.name}`, '<label>X</label><input id="tX" class="input" type="number"><label>Z</label><input id="tZ" class="input" type="number"><label>Reason</label><input id="mWhy" class="input">'); if (!ok) return; const why = $('mWhy').value.trim(); if (!why) return toast('Give a reason.', true); act('tp', p, { x: Number($('tX').value), z: Number($('tZ').value), reason: why }); } });
  }
  if (can('admin.spawn')) {
    items.push({ label: 'Give item…', run: async () => { const ok = await modal(`Give ${p.name} an item`, '<label>Class name (Parent; Attachment fits attachments)</label><input id="gI" class="input" placeholder="e.g. BandageDressing"><label>How many</label><input id="gN" class="input" type="number" value="1" min="1" max="50"><label>Reason</label><input id="mWhy" class="input">'); if (!ok) return; const why = $('mWhy').value.trim(); if (!why) return toast('Give a reason.', true); act('give', p, { item: $('gI').value.trim(), count: Number($('gN').value) || 1, reason: why }); } });
  }
  if (can('admin.kits')) {
    items.push({ label: 'Give kit…', run: async () => { const kits = await api('kits'); if (!kits.length) return toast('No kits yet (made in the app)', true); const ok = await modal(`Give ${p.name} a kit`, `<label>Kit</label><select id="gK" class="input">${kits.map(k => `<option value="${esc(k.name)}">${esc(k.name)} (${k.items})</option>`).join('')}</select><label>Reason</label><input id="mWhy" class="input">`); if (!ok) return; const why = $('mWhy').value.trim(); if (!why) return toast('Give a reason.', true); act('kit', p, { kit: $('gK').value, reason: why }); } });
  }
  if (can('admin.vehicles')) {
    items.push({ label: 'Spawn a vehicle next to them…', run: async () => { const v = await api('vehicles'); const ok = await modal(`Spawn a vehicle next to ${p.name}`, `<label>Vehicle (every part fitted, fluids full)</label><select id="gV" class="input">${v.map(x => `<option>${esc(x.name)}</option>`).join('')}</select><label>Reason</label><input id="mWhy" class="input">`); if (!ok) return; const why = $('mWhy').value.trim(); if (!why) return toast('Give a reason.', true); act('vehicle', p, { vehicle: $('gV').value, reason: why }); } });
  }
  if (can('admin.refund')) items.push({ label: 'Refund their last death…', run: withWhy(`Refund ${p.name}'s last death`, why => act('refund', p, { reason: why }), false, '<p class="muted small">Spawns the gear of their last recorded death at their feet; their body is removed.</p>') });
  if (can('admin.god')) items.push({ label: p.god ? 'God mode off' : 'God mode on', run: withWhy(`God mode ${p.god ? 'off' : 'on'} · ${p.name}`, why => act('god', p, { on: !p.god, reason: why })) });
  if (can('players.message')) items.push({ label: 'Message…', run: async () => { const ok = await modal(`Message ${p.name}`, '<label>Message (only they see it)</label><input id="mT" class="input">'); if (ok && $('mT').value.trim()) act('message', p, { text: $('mT').value.trim() }); } });
  if (can('players.kick')) items.push({ label: 'Kick…', danger: true, run: withWhy(`Kick ${p.name}?`, why => act('kick', p, { reason: why }), true, '<p class="muted small">The reason is shown to them.</p>') });
  if (can('players.ban')) items.push({ label: 'Ban…', danger: true, run: withWhy(`Ban ${p.name}?`, why => act('ban', p, { reason: why }), true, `<p class="muted small">Adds Steam64 ${esc(p.steam)} to ban.txt and kicks them.</p>`) });
  if (can('admin.kill')) items.push({ label: 'Kill…', danger: true, run: withWhy(`Kill ${p.name}?`, why => act('kill', p, { reason: why })) });
  return items;
}
async function pagePlayers(main) {
  main.innerHTML = '<div class="card"><div class="row"><h3 class="grow" style="margin:0">Online players</h3><span class="muted small" id="plWhen"></span></div><table id="plT"><thead><tr><th>Name</th><th>Health</th><th>Blood</th><th>Position</th><th>Vehicle</th><th></th></tr></thead><tbody></tbody></table><p class="muted small">Right-click a player, or use the ⋯ button, for actions. Positions come from the server every 1.5 s.</p></div>';
  const draw = async () => {
    live = await api('players'); const tb = main.querySelector('tbody');
    if (!live.available) { tb.innerHTML = `<tr><td colspan="6" class="muted">${esc(live.reason)}</td></tr>`; $('plWhen').textContent = ''; return; }
    $('plWhen').textContent = `${live.players.length} online · ${ago(live.at)}`;

    <div class="card"><h3>Blocked class names</h3><div class="muted small">Nobody can give or spawn these from the portal, whatever their permissions. One per line; * matches anything (e.g. <code>*_Gold</code>, <code>M4A1</code>).</div><textarea id="polBlocked" class="input mt" rows="4">${esc((d.policy && d.policy.blockedClasses || []).join('\n'))}</textarea><div class="row mt"><button class="btn" id="polSave">Save</button></div></div></div>`;
  $('polSave').onclick = () => api('setPolicy', { blockedClasses: $('polBlocked').value }).then(() => toast('Saved')).catch(e => toast(e.message, true));
  const checked = (root, attr) => [...root.querySelectorAll(`input[data-${attr}]:checked`)].map(i => i.dataset[attr]);
  const showUser = (u) => {
    $('uD').innerHTML = `<h3>${esc(u.name)}</h3><div class="muted small">Effective: ${u.perms.length} of ${d.catalogue.length} permissions</div>
      <label class="mt" style="display:block"><input type="checkbox" id="uTrust" ${u.trusted ? 'checked' : ''}> Trusted: skips approval and daily limits set on their groups</label>
      <div class="muted mt">Groups</div><div id="ug">${d.groups.map(g => `<label class="chip" style="cursor:pointer"><input type="checkbox" data-group="${esc(g.id)}" ${u.groups.includes(g.id) ? 'checked' : ''}> ${esc(g.name)}</label>`).join('')}</div>
      <div class="muted mt">Granted on top of the groups</div><div class="perm" id="ua">${permList(u.allow, 'a')}</div>
      <details class="mt"><summary class="muted">Denied even if a group grants it</summary><div class="perm" id="ud">${permList(u.deny, 'd')}</div></details>
      <div class="row mt"><button class="btn primary" id="uSave">Save</button><button class="btn" id="uPw">Set password</button><button class="btn" id="uTog">${u.enabled ? 'Disable' : 'Enable'}</button><button class="btn danger" id="uDel">Delete</button></div>`;
    const upd = (patch) => api('user', { op: 'update', id: u.id, patch }).then(() => { toast('Saved'); pageUsers(main); }).catch(e => toast(e.message, true));
    $('uSave').onclick = () => upd({ groups: checked($('ug'), 'group'), allow: checked($('ua'), 'perm'), deny: checked($('ud'), 'perm'), trusted: $('uTrust').checked });
    $('uPw').onclick = async () => { const ok = await modal(`Password for ${u.name}`, '<label>New password (8+ characters)</label><input id="np" class="input" type="password">'); if (ok) upd({ password: $('np').value }); };
    $('uTog').onclick = () => upd({ enabled: !u.enabled });
    $('uDel').onclick = async () => { if (await modal(`Delete ${u.name}?`, '<p class="muted">Their sessions end at once.</p>')) api('user', { op: 'delete', id: u.id }).then(() => pageUsers(main)).catch(e => toast(e.message, true)); };
  };
  const showGroup = (g) => {
    $('uD').innerHTML = `<h3>${esc(g.name)}</h3><label>Name</label><input id="gn" class="input" value="${esc(g.name)}" ${g.builtin ? 'disabled' : ''}><div class="muted mt">Permissions${g.id === 'owner' ? ' (the Owner group always has everything)' : ''}</div><div class="perm" id="gp">${permList(g.perms, 'p')}</div>
      ${g.id === 'owner' ? '' : `<div class="muted mt">Needs approval from someone with <b>requests.approve</b> before it runs</div><div class="perm" id="ga">${(d.categories || []).map(([k, l]) => `<label><input type="checkbox" data-cat="${k}" ${g.approval && g.approval[k] ? 'checked' : ''}> ${esc(l)}</label>`).join('')}</div>
      <label class="mt">Items per day (gives, kits and spawns; 0 = unlimited)</label><input id="gLimit" class="input" type="number" min="0" value="${Number(g.itemsPerDay) || 0}" style="width:120px">`}
      <div class="row mt"><button class="btn primary" id="gSave">Save</button>${g.builtin ? '' : '<button class="btn danger" id="gDel">Delete</button>'}</div>`;
    $('gSave').onclick = () => api('group', { op: 'upsert', id: g.id, name: $('gn').value, perms: checked($('gp'), 'perm'), approval: $('ga') ? Object.fromEntries(checked($('ga'), 'cat').map(c => [c, true])) : undefined, itemsPerDay: $('gLimit') ? Number($('gLimit').value) : undefined }).then(() => { toast('Saved'); pageUsers(main); }).catch(e => toast(e.message, true));
    const del = $('gDel'); if (del) del.onclick = async () => { if (await modal(`Delete the group ${g.name}?`, '<p class="muted">Its members keep their other groups.</p>')) api('group', { op: 'delete', id: g.id }).then(() => pageUsers(main)).catch(e => toast(e.message, true)); };
  };
  main.querySelector('#uT').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) showUser(d.users.find(u => u.id === tr.dataset.id)); });
  main.querySelector('#gT').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) showGroup(d.groups.find(g => g.id === tr.dataset.id)); });
  $('uNew').onclick = async () => { const ok = await modal('New user', `<label>User name</label><input id="nn" class="input"><label>Password (8+ characters)</label><input id="np" class="input" type="password"><label>Groups</label><div>${d.groups.map(g => `<label class="chip" style="cursor:pointer"><input type="checkbox" data-group="${esc(g.id)}"> ${esc(g.name)}</label>`).join('')}</div>`); if (!ok) return; try { await api('user', { op: 'create', name: $('nn').value, password: $('np').value, groups: checked(document.querySelector('.modalbg') || document, 'group') }); toast('User created'); pageUsers(main); } catch (e) { toast(e.message, true); } };
  $('gNew').onclick = async () => { const ok = await modal('New group', '<label>Name</label><input id="gn2" class="input">'); if (!ok) return; try { await api('group', { op: 'upsert', name: $('gn2').value, perms: [] }); pageUsers(main); } catch (e) { toast(e.message, true); } };
}
// ---------- requests ----------
async function pageRequests(main) {
  const draw = async () => {
    const d = await api('requests'); const pol = d.policy || {};
    const st = (r) => `<span class="badge ${r.status === 'pending' ? 'warn' : r.status === 'approved' ? 'ok' : r.status === 'denied' ? 'bad' : ''}">${esc(r.status)}</span>`;
    const res = (r) => !r.result ? '' : r.result.status === 'error' ? ` <span class="bad small">${esc(r.result.error)}</span>` : r.result.status === 'done' ? ` <span class="muted small">done${r.result.ok !== undefined ? ` (${r.result.ok} ok${r.result.fail ? ', ' + r.result.fail + ' failed' : ''})` : ''}</span>` : ` <span class="muted small">${esc(r.result.status)}</span>`;
    main.innerHTML = `<div class="card"><h3>${d.canApprove ? 'Requests from staff' : 'Your requests'}</h3>
      <div class="muted small">${pol.trusted ? 'You are trusted: nothing you do needs approval.' : pol.needs && pol.needs.length ? 'Needs approval for you: ' + esc(pol.needs.join(', ')) + '.' : 'Nothing you do needs approval.'}${pol.itemsPerDay ? ` Daily item limit ${pol.usedToday} of ${pol.itemsPerDay} used.` : ''} Pending requests expire after 24 hours.</div>
      <table class="mt"><thead><tr><th>#</th><th>When</th><th>Who</th><th>What</th><th>Status</th><th></th></tr></thead><tbody>${d.requests.map(r => `<tr><td>${r.id}</td><td class="muted small">${esc(ago(r.createdAt))}</td><td>${esc(r.byName)}</td><td>${esc(r.text)}${res(r)}</td><td>${st(r)}${r.decidedBy ? ` <span class="muted small">by ${esc(r.decidedBy)}${r.note ? ' · ' + esc(r.note) : ''}</span>` : ''}</td><td>${r.status !== 'pending' ? '' : d.canApprove && r.by !== me.id ? `<button class="btn small primary" data-op="approve" data-id="${r.id}">Approve</button> <button class="btn small danger" data-op="deny" data-id="${r.id}">Deny</button>` : r.by === me.id ? `<button class="btn small" data-op="cancel" data-id="${r.id}">Cancel</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No requests in the last 7 days.</td></tr>'}</tbody></table></div>`;
    main.querySelectorAll('[data-op]').forEach(b => b.onclick = async () => { let note = ''; if (b.dataset.op === 'deny') { note = await askReason('Why deny it?', '', false); if (note === null) return; } b.disabled = true; try { const r = await api('requestOp', { op: b.dataset.op, id: b.dataset.id, note }); toast(`Request #${r.id} ${r.status}${r.result && r.result.status === 'error' ? ' but it failed: ' + r.result.error : ''}`, r.result && r.result.status === 'error'); } catch (e) { toast(e.message, true); } draw(); });
  };
  await draw(); timer = setInterval(() => draw().catch(() => {}), 10000);
}
// ---------- player profile drawer ----------
const dur = (s) => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h} h ${m} min` : `${m} min`; };
function closeDrawer() { for (const el of document.querySelectorAll('.drawerbg, .drawer')) el.remove(); }
async function openPlayer(key, name) {
  closeDrawer(); let p;
  try { p = await api('player', null, { key }); } catch (e) { if (name && name !== key) { try { p = await api('player', null, { key: name }); } catch (e2) { return toast(e2.message, true); } } else return toast(e.message, true); }
  const bg = document.createElement('div'); bg.className = 'drawerbg'; bg.onclick = closeDrawer; const d = document.createElement('div'); d.className = 'drawer';
  const lp = p.live; const m = can('lists.manage');
  const flags = [p.lists.ban ? '<span class="badge bad">banned</span>' : '', p.lists.whitelist ? '<span class="badge ok">whitelisted</span>' : '', p.lists.priority ? '<span class="badge">priority</span>' : '', p.steam && p.steam.flagged ? '<span class="badge bad">Steam bans</span>' : '', p.account && p.account.suspicious ? '<span class="badge warn">⚠ suspicious</span>' : ''].filter(Boolean).join(' ');
  d.innerHTML = `<button class="btn small close">✕</button><h2>${esc(p.name)} ${lp ? '<span class="badge ok">online</span>' : ''}</h2><div>${flags}</div>
    <div class="kv mt"><span class="muted">Steam64</span><span>${p.steamId ? `${esc(p.steamId)} <a href="https://steamcommunity.com/profiles/${esc(p.steamId)}" target="_blank" rel="noopener">↗</a>` : '<span class="muted">unknown</span>'}</span><span class="muted">DayZ id</span><span class="small">${esc(p.id || p.key)}</span><span class="muted">Names</span><span>${esc(p.names.join(', '))}</span><span class="muted">Status</span><span>${lp ? `in game at ${Math.round(lp.x)}, ${Math.round(lp.z)} · health ${Math.round(lp.health * 100)}%${lp.vehicle ? ' · in ' + esc(lp.vehicle) : ''}` : 'last seen ' + esc(ago(p.lastSeen))}</span><span class="muted">Playtime</span><span>${dur(p.playtimeSec || 0)}</span><span class="muted">Kills / deaths</span><span>${p.kills} / ${p.deaths}</span>${p.discordId ? `<span class="muted">Discord</span><span>${esc(p.discordId)}${p.application ? ' · application ' + esc(p.application) : ''}</span>` : ''}</div>
    ${lp && (can('admin.heal') || can('admin.teleport') || can('admin.spawn') || can('players.kick')) ? '<div class="row mt"><button class="btn primary" id="prAct">Actions ▾</button></div>' : ''}
    ${can('lists.view') ? `<div class="sec">Lists</div><div class="row">${['ban', 'whitelist', 'priority'].map(k => `<span class="badge ${p.lists[k] ? (k === 'ban' ? 'bad' : 'ok') : ''}">${k}: ${p.lists[k] ? 'yes' : 'no'}</span>`).join('')}${m ? `<span class="grow"></span><button class="btn small" data-list="ban">${p.lists.ban ? 'Unban' : 'Ban…'}</button><button class="btn small" data-list="whitelist">${p.lists.whitelist ? 'Remove from whitelist' : 'Whitelist'}</button><button class="btn small" data-list="priority">${p.lists.priority ? 'Remove priority' : 'Priority'}</button>` : ''}</div>` : ''}
    ${can('lists.view') ? `<div class="sec">Note</div>${m ? `<textarea id="prNote" class="input" rows="2">${esc(p.notes || '')}</textarea><div class="row mt"><button class="btn small" id="prNoteSave">Save note</button></div>` : `<div>${esc(p.notes || '—')}</div>`}` : ''}
    ${p.steam ? `<div class="sec">Steam</div><div class="small">${esc(typeof p.steam.text === 'string' ? p.steam.text : JSON.stringify(p.steam))}</div>` : ''}
    ${p.account ? `<div class="sec">Account signals</div><div class="small">${esc((p.account.flags || []).join('; ') || 'nothing unusual')}${p.account.score ? ` <span class="muted">(score ${p.account.score})</span>` : ''}${p.account.ips ? `<div class="muted">${p.account.ips.length} address(es) seen</div>` : ''}</div>` : ''}
    ${p.combat ? `<div class="sec">Combat</div><div class="small">${p.combat.hits} hits dealt (${p.combat.dealt} dmg), ${p.combat.hitsTaken} taken, ${p.combat.headshots} headshots, longest kill ${Math.round(p.combat.longestKill || 0)} m${p.combat.flags && Object.keys(p.combat.flags).length ? ' · flags: ' + esc(Object.keys(p.combat.flags).join(', ')) : ''}</div>` : ''}
    ${can('deaths.view') ? `<div class="sec">Recent deaths</div>${p.recentDeaths.map(x => `<div class="small">#${x.id} ${esc(ago(x.ts))} · ${esc(x.cause === 'player' && x.killer ? 'killed by ' + x.killer.name : x.causeText)}${x.refunds ? ' <span class="badge ok">refunded</span>' : ''}</div>`).join('') || '<div class="muted small">none</div>'}` : ''}
    ${can('tickets.view') ? `<div class="sec">Tickets</div>${p.tickets.map(t => `<div class="small">#${esc(t.id)} ${esc(t.subject)} <span class="muted">${esc(t.status)}</span></div>`).join('') || '<div class="muted small">none</div>'}` : ''}
    ${can('audit.view') ? `<div class="sec">Admin actions on them</div>${p.actions.map(a => `<div class="small"><span class="muted">${esc(ago(a.ts))} · ${esc(a.who)}</span> ${esc(a.action.replace('admin:', ''))}: ${esc(String(a.details).slice(0, 140))}</div>`).join('') || '<div class="muted small">none</div>'}` : ''}`;
  document.body.appendChild(bg); document.body.appendChild(d);
  d.querySelector('.close').onclick = closeDrawer;
  const act = $('prAct'); if (act) act.onclick = () => { const r = act.getBoundingClientRect(); showMenu(playerMenu(lp).filter(i => i.h || i.label !== 'Profile'), r.left, r.bottom + 2); };
  const ns = $('prNoteSave'); if (ns) ns.onclick = async () => { try { await api('playerNote', { key: p.key, text: $('prNote').value }); toast('Note saved'); } catch (e) { toast(e.message, true); } };
  for (const b of d.querySelectorAll('[data-list]')) b.onclick = async () => {
    const kind = b.dataset.list; const on = p.lists[kind]; const id = p.steamId || p.id || p.key;
    if (on) { if (!(await modal(`Remove ${p.name} from the ${kind} list?`, ''))) return; try { await api('listOp', { op: 'remove', kind, id, name: p.name }); toast('Removed'); openPlayer(p.key); } catch (e) { toast(e.message, true); } return; }
    const why = kind === 'ban' ? await askReason(`Ban ${p.name}`, `<p class="muted small">Adds ${esc(id)} to ban.txt (they are kicked at their next join or by the server).</p>`) : await askReason(`${kind === 'whitelist' ? 'Whitelist' : 'Priority for'} ${p.name}`, '', false);
    if (why === null) return; try { await api('listOp', { op: 'add', kind, id, name: p.name, reason: why }); toast('Added'); openPlayer(p.key); } catch (e) { toast(e.message, true); }
  };
}
document.addEventListener('click', e => { const a = e.target.closest('[data-prof]'); if (a) { e.preventDefault(); openPlayer(a.dataset.prof, a.dataset.name); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); closeMenu(); $('hdHits').hidden = true; } });
// header search
let hsT = null;
$('hdSearch').oninput = () => { clearTimeout(hsT); const q = $('hdSearch').value.trim(); if (!q) { $('hdHits').hidden = true; return; } hsT = setTimeout(async () => { try { const rows = await api('playerSearch', null, { q }); const box = $('hdHits'); const r = $('hdSearch').getBoundingClientRect(); box.style.left = r.left + 'px'; box.style.top = (r.bottom + 4) + 'px'; box.innerHTML = rows.slice(0, 12).map(p => `<div data-key="${esc(p.key)}">${esc(p.name)} <span class="muted small">${p.online ? 'online' : ago(p.lastSeen)}${p.banned ? ' · banned' : ''}</span></div>`).join('') || '<div class="muted">No player matches.</div>'; box.hidden = false; } catch (e) { toast(e.message, true); } }, 250); };
$('hdHits').onclick = e => { const d = e.target.closest('[data-key]'); if (d) { $('hdHits').hidden = true; $('hdSearch').value = ''; openPlayer(d.dataset.key); } };
document.addEventListener('click', e => { if (!e.target.closest('#hdHits, #hdSearch')) $('hdHits').hidden = true; });
// ---------- lists ----------
async function pageLists(main) {
  const KINDS = [['ban', 'Bans', 'ban.txt'], ['whitelist', 'Whitelist', 'whitelist.txt'], ['priority', 'Priority queue', 'priority.txt'], ['bebans', 'BattlEye bans', 'battleye\\bans.txt']];
  let kind = 'ban'; const m = can('lists.manage');
  main.innerHTML = `<div class="card"><div class="tabs" id="lTabs">${KINDS.map(k => `<button data-k="${k[0]}" class="${k[0] === kind ? 'on' : ''}">${k[1]}</button>`).join('')}</div><div class="row"><input id="lq" class="input" placeholder="Search…" style="max-width:260px"><span class="muted small" id="lInfo"></span><span class="grow"></span>${m ? '<button class="btn primary" id="lAdd">Add</button>' : ''}</div><table id="lT" class="mt"><thead></thead><tbody></tbody></table></div>`;
  const draw = async () => {
    const all = await api('lists'); const l = all[kind]; const q = $('lq').value.trim().toLowerCase();
    const be = kind === 'bebans'; $('lInfo').textContent = `${l.entries.length} entr${l.entries.length === 1 ? 'y' : 'ies'} · ${KINDS.find(k => k[0] === kind)[2]}${l.exists === false ? ' (file not there yet)' : ''}`;
    main.querySelector('thead').innerHTML = be ? '<tr><th>GUID / IP</th><th>Minutes</th><th>Reason</th><th></th></tr>' : '<tr><th>Player</th><th>Steam64</th><th>DayZ id</th><th>Reason / note</th><th>Added</th><th></th></tr>';
    const rows = l.entries.filter(e => !q || JSON.stringify(e).toLowerCase().includes(q));
    main.querySelector('tbody').innerHTML = rows.map(e => be ? `<tr><td class="small">${esc(e.id)}</td><td>${esc(e.minutes || '0')}</td><td>${esc(e.reason || '')}</td><td>${m ? `<button class="btn small danger l-del" data-id="${esc(e.id)}">Remove</button>` : ''}</td></tr>`
      : `<tr><td>${e.name ? `<a href="#" data-prof="${esc(e.steamId || e.id)}" data-name="${esc(e.name)}">${esc(e.name)}</a>` : '<span class="muted">unknown</span>'}</td><td class="small">${esc(e.steamId || '')}</td><td class="small muted">${esc(e.id)}</td><td>${esc(e.reason || e.note || '')}</td><td class="muted small">${e.added ? esc(ago(e.added)) : ''}</td><td>${m ? `<button class="btn small danger l-del" data-id="${esc(e.steamId || e.id)}" data-name="${esc(e.name || '')}">Remove</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Empty.</td></tr>';
  };
  $('lTabs').onclick = e => { const b = e.target.closest('button[data-k]'); if (!b) return; kind = b.dataset.k; $('lTabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  let t; $('lq').oninput = () => { clearTimeout(t); t = setTimeout(draw, 200); };
  main.querySelector('#lT').addEventListener('click', async e => { const b = e.target.closest('.l-del'); if (!b) return; if (!(await modal(`Remove ${b.dataset.name || b.dataset.id} from this list?`, ''))) return; try { await api('listOp', { op: 'remove', kind, id: b.dataset.id, name: b.dataset.name }); toast('Removed'); draw(); } catch (err) { toast(err.message, true); } });
  const add = $('lAdd'); if (add) add.onclick = async () => {
    const be = kind === 'bebans';
    const ok = await modal(`Add to ${KINDS.find(k => k[0] === kind)[1]}`, be ? '<label>BattlEye GUID or IP</label><input id="aI" class="input"><label>Minutes (0 = permanent)</label><input id="aM" class="input" type="number" value="0"><label>Reason</label><input id="mWhy" class="input">' : `<label>Steam64 ID (or DayZ id)</label><input id="aI" class="input"><label>Player name (for your records)</label><input id="aN" class="input"><label>Reason${kind === 'ban' ? '' : ' (optional)'}</label><input id="mWhy" class="input">`, [['Add', true, true], ['Cancel', false]]);
    if (!ok) return; const why = $('mWhy').value.trim(); if ((kind === 'ban' || be) && !why) return toast('Give a reason.', true);
    try { await api('listOp', { op: 'add', kind, id: $('aI').value.trim(), name: be ? '' : $('aN').value.trim(), minutes: be ? Number($('aM').value) || 0 : undefined, reason: why }); toast('Added'); draw(); } catch (err) { toast(err.message, true); }
  };
  await draw();
}
